name: Live CLI Smoke

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run opt-in zero-cost CLI probes & handshakes
        env:
          NEOPOLITAN_LIVE_TESTS: '1'
        run: pnpm run test:live
