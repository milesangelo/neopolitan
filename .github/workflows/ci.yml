name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check:boundaries
      - run: pnpm run typecheck
      - run: pnpm run docs:api
      - run: pnpm run docs:build

  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Run coverage & runnable examples (Ubuntu Node 22)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          pnpm run test:coverage
          pnpm run examples:all
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  test-rollup:
    name: Test
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert all matrix test legs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix test result: ${{ needs.test.result }}"
            exit 1
          fi

  pack-and-verify:
    name: Pack, Publint, Attw & Consumer E2E
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:packed
